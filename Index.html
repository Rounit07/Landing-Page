<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Real Data Selling App</title>

  <!-- Website Icon -->
  <link rel="icon" type="image/png" href="Logo.jpeg">

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#020817;
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      color:white;
      padding:20px;
    }

    /* Mobile Container */
    .container{
      width:100%;
      max-width:360px;
      text-align:center;
    }

    /* Logo */
    .logo{
      width:115px;
      height:115px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:28px;
      border:3px solid rgba(255,255,255,0.12);
      box-shadow:0 0 25px rgba(255,255,255,0.15);
    }

    /* Heading */
    h1{
      font-size:34px;
      color:#facc15;
      font-weight:800;
      line-height:1.4;
      margin-bottom:18px;
      text-transform:uppercase;
    }

    /* Subtitle */
    .subtitle{
      font-size:22px;
      color:#d1d5db;
      line-height:1.8;
      margin-bottom:42px;
      font-weight:500;
    }

    /* Button */
    .btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-decoration:none;
      background:linear-gradient(90deg,#fde047,#93c5fd);
      color:black;
      padding:18px;
      border-radius:60px;
      font-size:23px;
      font-weight:bold;
      box-shadow:0 0 25px rgba(255,255,255,0.20);
      transition:0.3s;
    }

    .btn:active{
      transform:scale(0.98);
    }

    .btn i{
      font-size:22px;
    }

    footer{
      margin-top:45px;
      color:#6b7280;
      font-size:13px;
    }

    /* Small Devices */
    @media screen and (max-width:380px){

      .logo{
        width:100px;
        height:100px;
      }

      h1{
        font-size:28px;
      }

      .subtitle{
        font-size:18px;
      }

      .btn{
        font-size:20px;
        padding:16px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- Logo -->
    <img src="Logo.jpeg" alt="Logo" class="logo">

    <!-- Heading -->
    <h1>
      Real Data Selling App
    </h1>

    <!-- Subtitle -->
    <div class="subtitle">
      Daily Withdrawal <br>
      Worldwide 387K+ Active Users
    </div>

    <!-- Download Button -->
    <a href="https://t.me/yashdatasell"
       target="_blank"
       class="btn">

      <i class="fa-solid fa-download"></i>

      Download App

      <i class="fa-solid fa-download"></i>

    </a>

    <!-- Footer -->
    <footer>
      © 2026 All Rights Reserved
    </footer>

  </div>

</body>
</html>
